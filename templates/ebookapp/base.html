{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}Ebook Store{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ebookapp/styles.css' %}" />
  </head>

  <body>
    <!-- Navbar -->
    <div class="navbar">
      <div class="logo"><strong>Ebook Store</strong></div>

      <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'booklist' %}">Books</a>

        {% if user.is_authenticated %}
        <a href="{% url 'my_orders' %}">My Orders</a>
        <a href="{% url 'address_list' %}">Address</a>
        <a href="/ebook/cart/">Cart ({{ cart_count }})</a>
        <a href="/ebook/logout/">Logout</a>
        {% else %}
        <a href="/ebook/login/">Login</a>
        <a href="/ebook/signup/">Signup</a>
        {% endif %}
      </div>
    </div>

    {% block content %} {% endblock %}

    <div class="footer">© 2024 Ebook Store — All rights reserved.</div>
  </body>
</html>
